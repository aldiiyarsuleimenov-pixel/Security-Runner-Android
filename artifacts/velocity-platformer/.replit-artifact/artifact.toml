kind = "web"
previewPath = "/"
title = "Velocity: Impact Protocol"
description = "A fast 2D action platformer with responsive movement, dash, slide, and ground-slam abilities. Play with keyboard or touch controls."
version = "1.0.0"
id = "artifacts/velocity-platformer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19025

[services.development]
run = "pnpm --filter @workspace/velocity-platformer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/velocity-platformer", "run", "build" ]
serve = "static"
publicDir = "artifacts/velocity-platformer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19025"
BASE_PATH = "/"
