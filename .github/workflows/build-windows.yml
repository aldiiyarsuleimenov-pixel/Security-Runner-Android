name: Build Security Runner Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/velocity-platformer/**'
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'

jobs:
  # The workspace only installs Linux build tools (see overrides in pnpm-workspace.yaml),
  # so the game itself is built on Linux, exactly like the Android build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        run: pnpm install --frozen-lockfile --filter "@workspace/velocity-platformer..."

      - name: Build the game (relative paths so it works from a local file)
        run: pnpm --filter @workspace/velocity-platformer run build
        env:
          PORT: '3000'
          BASE_PATH: './'
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        with:
          name: game-web
          path: artifacts/velocity-platformer/dist/public

  # Packaging into a Windows .exe only needs Electron, not the workspace.
  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: game-web
          path: desktop/app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package Windows .exe
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Security-Runner-Windows
          path: desktop/dist/*.exe
