name: Build Security Runner APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build game for Android WebView
        working-directory: artifacts/velocity-platformer
        env:
          PORT: 4173
          BASE_PATH: ./
        run: pnpm run build

      - name: Copy web game into Android app
        run: |
          rm -rf android/app/src/main/assets/*
          mkdir -p android/app/src/main/assets
          cp -R artifacts/velocity-platformer/dist/public/. android/app/src/main/assets/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Security-Runner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
